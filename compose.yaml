name: hefesto-marketing
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Generar password root}
      MYSQL_DATABASE: mautic
      MYSQL_USER: mautic
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
    - dbdata:/var/lib/mysql
    networks:
    - backend
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u "$$MYSQL_USER" -e "SELECT 1" "$$MYSQL_DATABASE" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  web:
    image: hefesto-marketing-mautic:7.2.1
    restart: unless-stopped
    environment:
      MAUTIC_DB_HOST: db
      MAUTIC_DB_PORT: '3306'
      MAUTIC_DB_DATABASE: mautic
      MAUTIC_DB_USER: mautic
      MAUTIC_DB_PASSWORD: ${DB_PASSWORD:?Generar password DB}
      MAUTIC_MESSENGER_DSN_EMAIL: doctrine://default
      MAUTIC_MESSENGER_DSN_HIT: doctrine://default
      MAUTIC_MAILER_DSN: ${MAILER_DSN:-null://null}
      MAUTIC_MAILER_FROM_EMAIL: ${MAIL_FROM:?Configurar remitente}
      MAUTIC_MAILER_FROM_NAME: ${MAIL_FROM_NAME:-Hefesto Marketing}
      DOCKER_MAUTIC_LOAD_TEST_DATA: 'false'
      DOCKER_MAUTIC_RUN_MIGRATIONS: 'false'
      DOCKER_MAUTIC_WORKERS_CONSUME_EMAIL: '1'
      DOCKER_MAUTIC_WORKERS_CONSUME_HIT: '1'
      DOCKER_MAUTIC_WORKERS_CONSUME_FAILED: '1'
      PHP_INI_VALUE_DATE_TIMEZONE: America/Santiago
      PHP_INI_VALUE_MEMORY_LIMIT: 512M
      PHP_INI_VALUE_UPLOAD_MAX_FILESIZE: 64M
      PHP_INI_VALUE_POST_MAX_FILESIZE: 68M
      DOCKER_MAUTIC_ROLE: mautic_web
      HEFESTO_HOST: ${MARKETING_HOST:?Configurar dominio}
      HEFESTO_ADMIN_EMAIL: ${ADMIN_EMAIL:?Configurar correo}
      HEFESTO_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Generar password admin}
      HEFESTO_TRUSTED_PROXIES: ${TRUSTED_PROXIES:?Configurar proxy}
    volumes:
    - config:/var/www/html/config
    - logs:/var/www/html/var/logs
    - files:/var/www/html/docroot/media/files
    - images:/var/www/html/docroot/media/images
    networks:
    - default
    - backend
    build: .
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /var/www/html/config/.hefesto-ready && curl -fsS http://127.0.0.1/s/login >/dev/null
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s
  cron:
    image: hefesto-marketing-mautic:7.2.1
    restart: unless-stopped
    environment:
      MAUTIC_DB_HOST: db
      MAUTIC_DB_PORT: '3306'
      MAUTIC_DB_DATABASE: mautic
      MAUTIC_DB_USER: mautic
      MAUTIC_DB_PASSWORD: ${DB_PASSWORD:?Generar password DB}
      MAUTIC_MESSENGER_DSN_EMAIL: doctrine://default
      MAUTIC_MESSENGER_DSN_HIT: doctrine://default
      MAUTIC_MAILER_DSN: ${MAILER_DSN:-null://null}
      MAUTIC_MAILER_FROM_EMAIL: ${MAIL_FROM:?Configurar remitente}
      MAUTIC_MAILER_FROM_NAME: ${MAIL_FROM_NAME:-Hefesto Marketing}
      DOCKER_MAUTIC_LOAD_TEST_DATA: 'false'
      DOCKER_MAUTIC_RUN_MIGRATIONS: 'false'
      DOCKER_MAUTIC_WORKERS_CONSUME_EMAIL: '1'
      DOCKER_MAUTIC_WORKERS_CONSUME_HIT: '1'
      DOCKER_MAUTIC_WORKERS_CONSUME_FAILED: '1'
      PHP_INI_VALUE_DATE_TIMEZONE: America/Santiago
      PHP_INI_VALUE_MEMORY_LIMIT: 512M
      PHP_INI_VALUE_UPLOAD_MAX_FILESIZE: 64M
      PHP_INI_VALUE_POST_MAX_FILESIZE: 68M
      DOCKER_MAUTIC_ROLE: mautic_cron
    volumes:
    - config:/var/www/html/config
    - logs:/var/www/html/var/logs
    - files:/var/www/html/docroot/media/files
    - images:/var/www/html/docroot/media/images
    networks:
    - default
    - backend
    pull_policy: never
    depends_on:
      web:
        condition: service_healthy
  worker:
    image: hefesto-marketing-mautic:7.2.1
    restart: unless-stopped
    environment:
      MAUTIC_DB_HOST: db
      MAUTIC_DB_PORT: '3306'
      MAUTIC_DB_DATABASE: mautic
      MAUTIC_DB_USER: mautic
      MAUTIC_DB_PASSWORD: ${DB_PASSWORD:?Generar password DB}
      MAUTIC_MESSENGER_DSN_EMAIL: doctrine://default
      MAUTIC_MESSENGER_DSN_HIT: doctrine://default
      MAUTIC_MAILER_DSN: ${MAILER_DSN:-null://null}
      MAUTIC_MAILER_FROM_EMAIL: ${MAIL_FROM:?Configurar remitente}
      MAUTIC_MAILER_FROM_NAME: ${MAIL_FROM_NAME:-Hefesto Marketing}
      DOCKER_MAUTIC_LOAD_TEST_DATA: 'false'
      DOCKER_MAUTIC_RUN_MIGRATIONS: 'false'
      DOCKER_MAUTIC_WORKERS_CONSUME_EMAIL: '1'
      DOCKER_MAUTIC_WORKERS_CONSUME_HIT: '1'
      DOCKER_MAUTIC_WORKERS_CONSUME_FAILED: '1'
      PHP_INI_VALUE_DATE_TIMEZONE: America/Santiago
      PHP_INI_VALUE_MEMORY_LIMIT: 512M
      PHP_INI_VALUE_UPLOAD_MAX_FILESIZE: 64M
      PHP_INI_VALUE_POST_MAX_FILESIZE: 68M
      DOCKER_MAUTIC_ROLE: mautic_worker
    volumes:
    - config:/var/www/html/config
    - logs:/var/www/html/var/logs
    - files:/var/www/html/docroot/media/files
    - images:/var/www/html/docroot/media/images
    networks:
    - default
    - backend
    pull_policy: never
    depends_on:
      web:
        condition: service_healthy
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
    - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - config:/setup-status:ro
    expose:
    - '80'
    networks:
    - default
    - backend
    depends_on:
      web:
        condition: service_started
volumes:
  dbdata: {}
  config: {}
  logs: {}
  files: {}
  images: {}
networks:
  default: {}
  backend:
    internal: true
